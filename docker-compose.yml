# Chaapo — local development stack.
#
# Everything the app needs runs here. No cloud credentials are required to run
# the full core loop locally: payments use MockPaymentProvider, notifications use
# the dev transport (Mailpit + notification_outbox), storage uses MinIO with real
# presigned URLs, and malware scanning uses ClamAV.
#
#   docker compose up -d
#   npm run db:migrate && npm run db:seed
#   npm run dev          # in one terminal
#   npm run worker       # in another
#
# Region parity: production runs in ap-south-1 (Mumbai). NFR-20.

name: chaapo

services:
  postgres:
    # PostGIS 3.4 on Postgres 16 — geography(Point,4326) + ST_DWithin for
    # nearby-shop discovery (FR-101, NFR-02).
    image: postgis/postgis:16-3.4
    container_name: chaapo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaapo
      POSTGRES_PASSWORD: chaapo
      POSTGRES_DB: chaapo
      # Deterministic ordering for pickup codes / text comparisons.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chaapo -d chaapo']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Cache, BullMQ queues, SSE pub/sub fan-out, rate limits, session index.
    image: redis:7-alpine
    container_name: chaapo-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible PRIVATE object storage. Buckets are created private and are
    # never made public — files are only ever reachable through short-lived
    # presigned URLs issued by our API after an authorisation check (NFR-12).
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: chaapo-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: chaapo
      MINIO_ROOT_PASSWORD: chaapo-dev-secret
      MINIO_REGION: ap-south-1
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Creates the buckets with versioning + lifecycle rules and asserts they are
    # NOT publicly readable. Idempotent.
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: chaapo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/minio-init.sh']
    volumes:
      - ./infra/minio-init.sh:/init/minio-init.sh:ro
    restart: 'no'

  clamav:
    # Malware scanning for customer uploads (FR-205, NFR-15). Optional locally:
    # set MALWARE_SCANNER=noop to skip, but the seam stays identical.
    image: clamav/clamav:1.4
    platform: linux/amd64
    container_name: chaapo-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s

  mailpit:
    # Catches all outbound email in development. UI: http://localhost:8025
    image: axllent/mailpit:v1.22
    container_name: chaapo-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 2000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
